[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "regenai-assistant"
version = "0.1.0"
description = "Python assistant and approved Shopify support workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.4", "uvicorn==0.54.0", "pydantic-settings==2.15.0",
  "httpx==0.28.1", "cryptography==50.0.2", "python-multipart==0.0.32"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10", "mypy==2.4.0", "bandit==1.9.4"]

[project.scripts]
regenai-assistant = "regenai_assistant.cli:main"
regenai-assistant-mcp = "regenai_assistant.bridge:main"

[tool.setuptools.package-data]
regenai_assistant = ["content/*.json", "content/*.txt", "static/*"]

[tool.setuptools.packages.find]
include = ["regenai_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = true
