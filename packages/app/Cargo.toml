# Cargo workspace for @regenai/app Shopify Function extensions.
#
# Three deployable extensions compile to wasm32-unknown-unknown. The discount
# stacking rule crate remains in experimental until Shopify exposes enough
# trusted input to enforce its code-combination policy.

[workspace]
resolver = "2"
members = [
    "extensions-shared",
    "extensions/cart-contraindication",
    "extensions/b2b-tiered-pricing",
    "extensions/delivery-customization",
    "experimental/discount-stacking",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Zahidulislam2222/regenai"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shopify_function = "2.2.0"

[profile.release]
# Shopify caps each compiled Function binary at 256 kB. Optimise
# aggressively for code size, not speed — Function runs are short-lived.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
