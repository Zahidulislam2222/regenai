query Input {
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
          product {
            id
            title
          }
        }
      }
    }
    buyerIdentity {
      purchasingCompany {
        company {
          id
          tier: metafield(namespace: "regenai", key: "tier") {
            value
          }
        }
        location {
          id
          locationTier: metafield(namespace: "regenai", key: "location_tier") {
            value
          }
        }
      }
    }
  }
}
