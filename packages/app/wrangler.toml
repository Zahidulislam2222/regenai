#:schema node_modules/wrangler/config-schema.json
#
# @regenai/app — custom merchant Remix app on Cloudflare Workers + D1.
# Handles clinician-review workflow, protocol engine, FDA claim audit,
# subscription management, B2B portal. Full scope in PROJECT_PLAN §2
# "Layer 2 — Custom Shopify App".
#
# ADR-021 (Day 15) documents the Cloudflare Workers + D1 choice vs
# Fly.io / Railway.

name = "regenai-app"
main = "./workers/app.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Production D1 is the only remote data binding. Preview and staging are
# intentionally unbound until isolated databases are allocated and migrated.

[[d1_databases]]
binding = "DB"
database_name = "regenai-app"
database_id = "aa1f0764-b931-4e70-88a4-a035e9439982"
migrations_dir = "migrations"

[vars]
SHOPIFY_APP_URL = "https://regenai-app.regenai-workers.workers.dev"
SHOPIFY_API_SCOPES = "read_products"
SHOPIFY_OAUTH_STATE_TTL_SECONDS = "600"
SHOPIFY_SESSION_TTL_SECONDS = "3600"
REVIEW_QUEUE_LIMIT = "50"

# -----------------------------------------------------------------------
# Preview environment — ephemeral per-PR deploys.
# -----------------------------------------------------------------------
[env.preview]
name = "regenai-app-preview"

[env.preview.vars]
SHOPIFY_APP_URL = "https://regenai-app-preview.regenai-workers.workers.dev"
SHOPIFY_API_SCOPES = "read_products"
SHOPIFY_OAUTH_STATE_TTL_SECONDS = "600"
SHOPIFY_SESSION_TTL_SECONDS = "3600"
REVIEW_QUEUE_LIMIT = "50"

# -----------------------------------------------------------------------
# Staging environment.
# -----------------------------------------------------------------------
[env.staging]
name = "regenai-app-staging"

[env.staging.vars]
SHOPIFY_APP_URL = "https://regenai-app-staging.regenai-workers.workers.dev"
SHOPIFY_API_SCOPES = "read_products"
SHOPIFY_OAUTH_STATE_TTL_SECONDS = "600"
SHOPIFY_SESSION_TTL_SECONDS = "3600"
REVIEW_QUEUE_LIMIT = "50"

# -----------------------------------------------------------------------
# Production environment.
# -----------------------------------------------------------------------
[env.production]
name = "regenai-app"

[[env.production.d1_databases]]
binding = "DB"
database_name = "regenai-app"
database_id = "aa1f0764-b931-4e70-88a4-a035e9439982"
migrations_dir = "migrations"

[env.production.vars]
SHOPIFY_APP_URL = "https://regenai-app.regenai-workers.workers.dev"
SHOPIFY_API_SCOPES = "read_products"
SHOPIFY_OAUTH_STATE_TTL_SECONDS = "600"
SHOPIFY_SESSION_TTL_SECONDS = "3600"
REVIEW_QUEUE_LIMIT = "50"
