name: Test — Accessibility (axe-core)

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: test-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe-core via Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build and test checked-out storefront
        run: bash .github/scripts/run-storefront-browser-check.sh a11y

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: axe-report
          path: |
            packages/storefront/playwright-report/
            packages/storefront/test-results/
          if-no-files-found: ignore
          retention-days: 7
