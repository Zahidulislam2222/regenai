name: Test — Visual Regression (optional Percy)

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: test-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  percy:
    name: Percy visual diff (opt-in)
    # Percy may use a metered external service. A missing opt-in is a skipped
    # check, never a green no-op. Forked PR code must not receive credentials.
    if: ${{ vars.REGENAI_PERCY_APPROVED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      PREVIEW_URL: ${{ vars.REGENAI_VISUAL_BASE_URL }}
      PLAYWRIGHT_TEST_DIR: tests/visual
    steps:
      - uses: actions/checkout@v4

      - name: Require visual specs and configured inputs
        run: |
          if ! find packages/storefront/tests/visual -name '*.spec.*' -print -quit 2>/dev/null | grep -q .; then
            echo '::error::No visual specs exist under packages/storefront/tests/visual'
            exit 1
          fi
          if [ -z "$PERCY_TOKEN" ]; then
            echo '::error::PERCY_TOKEN is unset'
            exit 1
          fi
          if [[ ! "$PREVIEW_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/.*)?$ ]]; then
            echo '::error::REGENAI_VISUAL_BASE_URL must be an HTTPS URL with a hostname'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Percy visual diff against configured preview
        working-directory: packages/storefront
        run: npx percy exec -- playwright test
