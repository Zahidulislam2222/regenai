name: Test — Load (manual opt-in k6)

on:
  workflow_dispatch: {}

jobs:
  k6:
    name: k6 load scenarios (opt-in)
    # Secret presence is not approval for traffic against a remote service.
    if: ${{ vars.REGENAI_LOAD_TEST_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      K6_TARGET_URL: ${{ vars.REGENAI_LOAD_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Require scenarios and approved target
        run: |
          for scenario in tests/load/quiz.js tests/load/recommendation.js; do
            if [ ! -f "$scenario" ]; then
              echo "::error::Missing k6 scenario: $scenario"
              exit 1
            fi
          done
          if [[ ! "$K6_TARGET_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/.*)?$ ]]; then
            echo '::error::REGENAI_LOAD_BASE_URL must be an HTTPS URL with a hostname'
            exit 1
          fi

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run load scenarios
        run: |
          k6 run tests/load/quiz.js
          k6 run tests/load/recommendation.js
