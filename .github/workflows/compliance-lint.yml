name: Content — Product Copy Red Flags

on:
  pull_request:
    paths:
      - 'packages/storefront/app/content/**'
      - 'scripts/catalog-seed/seed-config.json'
      - 'scripts/compliance-lint*'
      - '.github/workflows/compliance-lint.yml'
  push:
    branches: [main, staging]
    paths:
      - 'packages/storefront/app/content/**'
      - 'scripts/catalog-seed/seed-config.json'
      - 'scripts/compliance-lint*'
      - '.github/workflows/compliance-lint.yml'

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claim-lint:
    name: Product copy red-flag guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Test guard failure cases
        run: node --test scripts/compliance-lint.test.mjs

      - name: Check product catalog and storefront copy
        run: node scripts/compliance-lint.mjs
