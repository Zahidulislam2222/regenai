name: Test — Unit + Component

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: test-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest (unit + component)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Complete JavaScript suite
        run: npm test

      - name: Publication workflow contracts
        run: node --test .github/tests/publication-workflows.test.mjs
