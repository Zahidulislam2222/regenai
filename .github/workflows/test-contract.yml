name: Test — Contract (Storefront GraphQL schema)

on:
  pull_request:
    paths:
      - 'packages/storefront/app/**'
      - 'packages/storefront/.graphqlrc.ts'
      - 'packages/storefront/package.json'
      - 'packages/storefront/storefrontapi.generated.d.ts'
      - 'packages/storefront/customer-accountapi.generated.d.ts'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/run-storefront.mjs'
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC — catch Shopify schema drift

jobs:
  contract:
    name: GraphQL schema contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run codegen
        run: npm run codegen

      - name: Detect schema drift
        run: |
          if ! git diff --quiet -- packages/storefront/storefrontapi.generated.d.ts packages/storefront/customer-accountapi.generated.d.ts; then
            echo "::error::GraphQL generated types drifted — run npm run codegen and commit the result"
            git diff --stat -- packages/storefront/storefrontapi.generated.d.ts packages/storefront/customer-accountapi.generated.d.ts
            exit 1
          fi
