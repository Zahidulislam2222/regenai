name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the private release environment}

services:
  frontend:
    image: ${FRONTEND_NGINX_IMAGE:?Set a supervisor-verified image@sha256 digest}
    user: "101:101"
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${FRONTEND_TMPFS_SIZE:?Set FRONTEND_TMPFS_SIZE},mode=1777
    mem_limit: ${FRONTEND_MEMORY_LIMIT:?Set FRONTEND_MEMORY_LIMIT}
    cpus: ${FRONTEND_CPU_LIMIT:?Set FRONTEND_CPU_LIMIT}
    pids_limit: ${FRONTEND_PIDS_LIMIT:?Set FRONTEND_PIDS_LIMIT}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:?Set loopback FRONTEND_BIND_ADDRESS}:${FRONTEND_BIND_PORT:?Set FRONTEND_BIND_PORT}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${FRONTEND_DIST_PATH:?Set FRONTEND_DIST_PATH to the versioned built artifact}:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
