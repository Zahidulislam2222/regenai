worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format frontend_minimal '$status $request_method';
    access_log /dev/stdout frontend_minimal;

    map $uri $frontend_cache_control {
        default "no-store, no-transform";
        "~^/assets/.+-[A-Za-z0-9_-]{8,}\\.[a-z0-9]+$" "public, max-age=31536000, immutable, no-transform";
        ~^/media/ "public, max-age=0, must-revalidate, no-transform";
        =/favicon.svg "public, max-age=0, must-revalidate, no-transform";
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_max_body_size 1k;
    client_body_temp_path /tmp/nginx_client_body 1 2;
    proxy_temp_path /tmp/nginx_proxy 1 2;
    fastcgi_temp_path /tmp/nginx_fastcgi 1 2;
    uwsgi_temp_path /tmp/nginx_uwsgi 1 2;
    scgi_temp_path /tmp/nginx_scgi 1 2;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        add_header Cache-Control $frontend_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Resource-Policy same-origin always;

        location = /healthz {
            access_log off;
            return 204;
        }

        location = / {
            try_files /index.html =404;
        }

        location = /collections/all {
            try_files /index.html =404;
        }

        location = /search {
            try_files /index.html =404;
        }

        location = /quiz {
            try_files /index.html =404;
        }

        location = /cart {
            try_files /index.html =404;
        }

        location = /about {
            try_files /index.html =404;
        }

        location = /evidence {
            try_files /index.html =404;
        }

        location ~ ^/products/(pulse|roller|bands|wrap|balls|sensor)$ {
            try_files /index.html =404;
        }

        location ~ ^/policies/(privacy|delivery)$ {
            try_files /index.html =404;
        }

        location ~ (^|/)\. {
            return 404;
        }

        location ~* \.(?:avif|css|gif|ico|jpe?g|js|mjs|map|otf|png|svg|ttf|wasm|webp|woff2?)$ {
            try_files $uri =404;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location /media/ {
            try_files $uri =404;
        }

        location = /favicon.svg {
            try_files $uri =404;
        }

        location = /index.html {
            internal;
        }

        location / {
            error_page 404 =404 /index.html;
            try_files $uri =404;
        }
    }
}
